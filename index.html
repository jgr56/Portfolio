<style>* { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f4f1e9;
      color: #30372d;
      font: 16px/1.7 Georgia, serif;
    }
    a { color: inherit; text-underline-offset: 6px; }
    header, main, footer {
      max-width: 1000px;
      margin: auto;
      padding: 28px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 24px; text-decoration: none; }
    nav { display: flex; gap: 24px; font: 14px sans-serif; }
    nav a { text-decoration: none; }
    .hero { padding: 80px 0; position: relative; }
    .circle {
      width: 150px;
      height: 150px;
      border: 12px solid #a34c3e;
      border-right-color: transparent;
      border-radius: 50%;
      transform: rotate(-25deg);
      opacity: .8;
    }
    .eyebrow {
      margin-top: 32px;
      font: 12px sans-serif;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    h1 {
      max-width: 650px;
      margin: 16px 0;
      font-size: clamp(42px, 8vw, 76px);
      font-weight: normal;
      line-height: 1.1;
    }
    .intro { max-width: 440px; color: #666c60; }
    h2 { font-size: 24px; font-weight: normal; }
    .projects {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }
    article { border-top: 1px solid #bfc3b6; padding-top: 20px; }
    .art {
      height: 190px;
      display: grid;
      place-items: center;
      background: #e1e4d8;
    }
    .stone {
      width: 100px;
      height: 65px;
      background: #7d8573;
      border-radius: 55% 45% 40% 60%;
      box-shadow: 0 14px 20px #30372d18;
    }
    .sand {
      background: repeating-radial-gradient(
        ellipse at center, #e8dfcf 0 9px, #d9cdb8 10px 11px
      );
    }
    article h3 { margin-bottom: 0; font-weight: normal; }
    article p { margin-top: 4px; color: #666c60; }
    #contact { padding: 65px 0 30px; }
    footer { border-top: 1px solid #d5d7cc; font-size: 13px; }
    a:focus-visible { outline: 2px solid #a34c3e; outline-offset: 6px; }
    @media (max-width: 550px) {
      .projects { grid-template-columns: 1fr; }
      .hero { padding: 45px 0; }
      nav { gap: 16px; }
    }</style>
